<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Money Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --blue: #0038A8; }
        .header { background: linear-gradient(135deg, #0038A8, #002266); }
        th { background: #0038A8; color: white; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
<div class="max-w-7xl mx-auto">
    <div class="header text-white p-8 text-center">
        <h1 class="text-4xl font-bold">Mobile Money Analyzer</h1>
        <p class="text-blue-100">Advanced Statement Analysis with Date Range</p>
    </div>

    <div class="p-8">
        <form id="analyzeForm" enctype="multipart/form-data" class="bg-white p-8 rounded-3xl shadow mb-12">
            <div class="grid md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Phone Number (Optional Filter)</label>
                    <input type="text" id="phone_number" name="phone_number" 
                           class="w-full p-4 border rounded-2xl focus:border-[#0038A8]" 
                           placeholder="01918168439">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">From Date</label>
                    <input type="date" id="from_date" name="from_date" 
                           class="w-full p-4 border rounded-2xl focus:border-[#0038A8]">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">To Date</label>
                    <input type="date" id="to_date" name="to_date" 
                           class="w-full p-4 border rounded-2xl focus:border-[#0038A8]">
                </div>
            </div>

            <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Upload Statement (TXT, PDF, DOCX)</label>
                <input type="file" id="file" name="file" accept=".txt,.pdf,.docx" 
                       class="w-full p-3 border rounded-2xl">
            </div>

            <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Or Paste Statement Text</label>
                <textarea id="text_data" name="text_data" rows="5" 
                          class="w-full p-4 border rounded-2xl focus:border-[#0038A8]"></textarea>
            </div>

            <button type="submit" 
                    class="mt-8 w-full bg-[#0038A8] hover:bg-[#002266] py-4 text-white font-bold rounded-2xl text-lg">
                ANALYZE STATEMENT
            </button>
        </form>

        <div id="results" class="hidden">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-3xl shadow text-center">
                    <p class="text-gray-500">Total Sent</p>
                    <p id="total_sent" class="text-3xl font-bold text-red-600">0.00</p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow text-center">
                    <p class="text-gray-500">Total Received</p>
                    <p id="total_received" class="text-3xl font-bold text-green-600">0.00</p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow text-center">
                    <p class="text-gray-500">Net Flow</p>
                    <p id="net_flow" class="text-3xl font-bold">0.00</p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow text-center">
                    <p class="text-gray-500">Transactions</p>
                    <p id="tx_count" class="text-3xl font-bold text-[#0038A8]">0</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow overflow-x-auto">
                <h3 class="font-semibold mb-4 text-[#0038A8]">Transaction Details</h3>
                <table class="w-full text-sm" id="txTable">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-3 text-left">Date</th>
                            <th class="p-3 text-left">Type</th>
                            <th class="p-3 text-left">Phone Number</th>
                            <th class="p-3 text-right">Out</th>
                            <th class="p-3 text-right">In</th>
                            <th class="p-3 text-right">Balance</th>
                            <th class="p-3 text-center">Owner</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        const response = await fetch('/analyze', { 
            method: 'POST', 
            body: formData 
        });
        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        // Fill Statistics
        document.getElementById('total_sent').textContent = data.total_sent;
        document.getElementById('total_received').textContent = data.total_received;
        document.getElementById('net_flow').textContent = data.net_flow;
        document.getElementById('tx_count').textContent = data.total_transactions;

        // Populate Table
        const tbody = document.querySelector('#txTable tbody');
        tbody.innerHTML = '';

        data.transactions.forEach(tx => {
            const row = document.createElement('tr');
            row.className = "border-b hover:bg-gray-50";
            row.innerHTML = `
                <td class="p-3">${tx.date} ${tx.time || ''}</td>
                <td class="p-3">${tx.type}</td>
                <td class="p-3 font-mono">${tx.counterparty || 'N/A'}</td>
                <td class="p-3 text-right text-red-600">${tx.out}</td>
                <td class="p-3 text-right text-green-600">${tx.in}</td>
                <td class="p-3 text-right">${tx.balance}</td>
                <td class="p-3 text-center">
                    ${tx.counterparty ? 
                    `<button onclick="lookupOwner('${tx.counterparty}', this)" 
                     class="bg-[#0038A8] hover:bg-blue-900 text-white text-xs
